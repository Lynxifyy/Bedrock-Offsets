[package]
name = "offset_core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Zero-copy Bedrock offset harvester core engine"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
libc = "0.2"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
