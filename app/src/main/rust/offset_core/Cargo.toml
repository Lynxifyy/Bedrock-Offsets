[package]
name = "offset_core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Zero-copy Bedrock offset harvester core engine"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
libc = "0.2"
jni = "0.21"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
memmap2 = "0.9"
goblin = "0.10"
aho-corasick = "1.1"
rayon = "1.12"
capstone = { version = "0.14", default-features = false, features = ["full", "std", "arch_arm64"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
