name: Android CI

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and unit test
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The Gradle build cross-compiles the Rust engine, so this job needs the
      # same toolchain the release job uses. `cargo` alone is not enough:
      # cargo-ndk and the NDK are what actually target arm64-v8a.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache the cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/src/main/rust/offset_core/target
          key: cargo-test-${{ runner.os }}-${{ hashFiles('app/src/main/rust/offset_core/Cargo.lock') }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Set up the Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Point the engine build at the NDK
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew test --stacktrace --no-daemon

      - name: Check Kotlin formatting
        run: ./gradlew ktlintCheck --stacktrace --no-daemon

      - name: Run Android lint
        run: ./gradlew lintDebug --stacktrace --no-daemon

      - name: Assemble the release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Verify the release APK
        run: python3 scripts/verify_release.py

      # The R8 mapping turns a shrunk stack trace or a Gson failure back into a
      # class name. It is only useful for the exact artefact it was built from,
      # so it is uploaded next to the test reports.
      - name: Upload the R8 mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/release/
          if-no-files-found: ignore

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
  tooling:
    name: Python tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the build scripts
        run: python3 -m unittest discover -s scripts/tests -t . -v

      - name: Check the signature pack is up to date
        run: python3 scripts/generate_patterns.py patterns.txt --check

      # The pack must also be reproducible from the source it claims to come
      # from. This rebuilds it from the committed `patterns.txt` and compares,
      # which catches a hand-edit that the generator would not produce.
      - name: Check the signature pack round-trips
        run: |
          python3 scripts/generate_patterns.py patterns.txt
          git diff --exit-code app/src/main/assets/patterns.json
  rust:
    name: Rust engine
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache the cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/src/main/rust/offset_core/target
          key: cargo-${{ runner.os }}-${{ hashFiles('app/src/main/rust/offset_core/Cargo.lock') }}

      - name: Check formatting
        working-directory: app/src/main/rust/offset_core
        run: cargo fmt --all --check

      - name: Lint
        working-directory: app/src/main/rust/offset_core
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: app/src/main/rust/offset_core
        run: cargo test --all-targets

      - name: Check the documentation builds
        working-directory: app/src/main/rust/offset_core
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps

      - name: Audit dependencies
        run: |
          cargo install cargo-audit --locked
          cargo audit --file app/src/main/rust/offset_core/Cargo.lock
