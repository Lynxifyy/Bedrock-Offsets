name: Release

# Builds the release APK on a version tag and publishes it, with a changelog
# generated from the commits since the previous tag.
#
# Signing: the release is signed only when the signing secrets are present. The
# workflow checks first and says so, rather than producing a silently unsigned
# artefact.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache the cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/src/main/rust/offset_core/target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('app/src/main/rust/offset_core/Cargo.lock') }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Set up the Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Cross-compile the Rust engine
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: python3 scripts/build_rust.py

      - name: Confirm the engine is staged
        run: python3 scripts/build_rust.py --check-only

      - name: Stage the signing material
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          # The secret holds the keystore base64-encoded. It is decoded into
          # the runner's temporary directory, which is not part of the
          # workspace and is discarded when the job ends.
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No SIGNING_KEYSTORE_BASE64 secret; the APK will be signed with the debug key."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keystore="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "keystore=$keystore" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "Signing material staged at $keystore"

      - name: Assemble the release APK
        env:
          SIGNING_KEYSTORE: ${{ steps.signing.outputs.keystore }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Verify the release APK
        run: python3 scripts/verify_release.py

      - name: Fail if the release was meant to be signed but is not
        if: steps.signing.outputs.signed == 'true'
        run: |
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          # apksigner exits non-zero on an unsigned APK, which is the failure
          # mode this guard exists to catch.
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$apk"

      - name: Rename the APK for the release
        id: apk
        run: |
          version="${GITHUB_REF_NAME}"
          source_apk=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          target="bedrock-offset-extractor-${version}.apk"
          cp "$source_apk" "$target"
          echo "path=$target" >> "$GITHUB_OUTPUT"
          echo "Built $target from $source_apk"

      - name: Generate the changelog
        run: |
          previous=$(git tag --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -n 1)
          if [ -n "$previous" ]; then
            range="${previous}..${GITHUB_REF_NAME}"
          else
            range="${GITHUB_REF_NAME}"
          fi
          python3 scripts/changelog.py \
            --version "${GITHUB_REF_NAME}" \
            --revision "$range" \
            --repository-slug "${GITHUB_REPOSITORY}" \
            --output release-notes.md
          cat release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            cat release-notes.md
            echo
            echo "### Verifying the download"
            echo
            echo '```'
            echo "sha256sum bedrock-offset-extractor-${GITHUB_REF_NAME}.apk"
            echo '```'
          } > notes.md

          gh release create "${GITHUB_REF_NAME}" \
            --title "Bedrock Offset Extractor ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            "${{ steps.apk.outputs.path }}"

      - name: Upload the build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-reports
          path: |
            app/build/reports/
            release-notes.md
          if-no-files-found: ignore
